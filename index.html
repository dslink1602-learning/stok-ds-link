<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STOK DS LINK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    /* HEADER */
    .header {
      background: #1261a8;
      color: white;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 10px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    /* SEARCH */
    .search-box {
      width: 100%;
      padding: 15px 17px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .search-box:focus {
      border-color: #1261a8;
      box-shadow: 0 0 0 2px rgba(18, 97, 168, 0.1);
    }

    .info {
      margin: 12px 3px;
      color: #666;
      font-size: 14px;
    }

    /* LOADING */
    .loading {
      text-align: center;
      background: white;
      border-radius: 10px;
      padding: 30px 15px;
      margin-top: 15px;
      color: #666;
    }

    /* HASIL */
    .result-list {
      margin-top: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      padding: 16px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .plu {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }

    /* STOK */
    .stock-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #f5f5f5;
    }

    .stock-label {
      font-size: 13px;
      color: #666;
    }

    .stock-number {
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      font-weight: bold;
      padding: 6px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .status-available {
      background: #e7f6ec;
      color: #16823b;
    }

    .status-empty {
      background: #fdeaea;
      color: #d93025;
    }

    .status-po {
      background: #fff3cd;
      color: #9a6700;
    }

    /* HARGA */
    .price-area {
      border-top: 1px solid #eee;
      padding-top: 12px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      margin: 7px 0;
      font-size: 14px;
    }

    .price-row .label {
      color: #666;
    }

    .discount {
      color: #d93025;
      font-weight: bold;
    }

    .final-price {
      font-size: 20px;
      font-weight: bold;
      color: #d93025;
    }

    /* KETERANGAN */
    .note {
      margin-top: 12px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 7px;
      font-size: 13px;
      color: #555;
    }

    /* EMPTY */
    .empty {
      text-align: center;
      background: white;
      border-radius: 10px;
      padding: 35px 15px;
      color: #777;
      margin-top: 15px;
    }

    .count {
      font-weight: bold;
      color: #1261a8;
    }

    /* DESKTOP */
    @media (min-width: 700px) {

      .header {
        font-size: 25px;
      }

      .product {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    STOK DS LINK
  </div>

  <div class="container">

    <input
      type="text"
      id="search"
      class="search-box"
      placeholder="🔎 Cari PLU / nama produk..."
      autocomplete="off"
    >

    <div id="info" class="info">
      Mengambil data stok...
    </div>

    <div id="loading" class="loading">
      ⏳ Mengambil data dari Google Sheet...
    </div>

    <div id="results" class="result-list"></div>

  </div>


  <script>

    /*
     * URL API Google Apps Script
     */
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzoE0TDGMvqvVmA3_A4UMsa1xC4Gw6YOXcF94McFV9kommywEzh-oHahOVZuyiYdzBzbA/exec";


    let products = [];


    /*
     * Ambil data menggunakan JSONP.
     *
     * Cara ini dipakai karena browser membatasi
     * request langsung dari GitHub Pages ke Apps Script.
     */
    function loadData() {

      const callbackName =
        "dsLinkCallback_" + Date.now();

      window[callbackName] = function(response) {

        if (!response || !response.success) {

          showError(
            "Data stok tidak berhasil diambil."
          );

          return;
        }

        products = response.data || [];

        document.getElementById("loading").style.display =
          "none";

        document.getElementById("info").innerHTML =
          "Data stok: <span class='count'>" +
          products.length.toLocaleString("id-ID") +
          "</span> produk";

        /*
         * Hapus script JSONP setelah selesai
         */
        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }
      };


      const script =
        document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?callback=" +
        encodeURIComponent(callbackName);

      script.onerror = function() {

        showError(
          "Gagal menghubungkan aplikasi dengan data stok."
        );

      };

      document.body.appendChild(script);
    }


    /*
     * Pencarian
     */
    document
      .getElementById("search")
      .addEventListener("input", function() {

        const keyword =
          this.value
            .trim()
            .toLowerCase();

        if (!keyword) {

          document.getElementById("results").innerHTML =
            "";

          document.getElementById("info").innerHTML =
            "Data stok: <span class='count'>" +
            products.length.toLocaleString("id-ID") +
            "</span> produk";

          return;
        }

        const filtered =
          products.filter(function(item) {

            const plu =
              String(item.plu || "")
                .toLowerCase();

            const nama =
              String(item.nama || "")
                .toLowerCase();

            const keterangan =
              String(item.keterangan || "")
                .toLowerCase();

            return (
              plu.includes(keyword) ||
              nama.includes(keyword) ||
              keterangan.includes(keyword)
            );

          });

        renderResults(filtered);

      });


    /*
     * Tampilkan hasil
     */
    function renderResults(data) {

      const results =
        document.getElementById("results");

      results.innerHTML = "";

      document.getElementById("info").innerHTML =
        "Ditemukan <span class='count'>" +
        data.length.toLocaleString("id-ID") +
        "</span> produk";


      if (data.length === 0) {

        results.innerHTML = `
          <div class="empty">
            🔎<br><br>
            Produk tidak ditemukan.
          </div>
        `;

        return;
      }


      /*
       * Batasi hasil awal agar halaman tetap ringan.
       * Bisa kita ubah nanti.
       */
      const displayData =
        data.slice(0, 100);


      displayData.forEach(function(item) {

        const product =
          createProductCard(item);

        results.appendChild(product);

      });


      if (data.length > 100) {

        const more =
          document.createElement("div");

        more.className = "empty";

        more.textContent =
          "Menampilkan 100 hasil pertama dari " +
          data.length.toLocaleString("id-ID") +
          " hasil.";

        results.appendChild(more);
      }
    }


    /*
     * Membuat kartu produk
     */
    function createProductCard(item) {

      const card =
        document.createElement("div");

      card.className = "product";


      const name =
        document.createElement("div");

      name.className = "product-name";

      name.textContent =
        item.nama || "-";


      const plu =
        document.createElement("div");

      plu.className = "plu";

      plu.textContent =
        "PLU: " + (item.plu || "-");


      /*
       * STOK
       */
      const stockBox =
        document.createElement("div");

      stockBox.className = "stock-box";


      const stockLeft =
        document.createElement("div");

      const stockLabel =
        document.createElement("div");

      stockLabel.className =
        "stock-label";

      stockLabel.textContent =
        "STOK AKHIR";


      const stockNumber =
        document.createElement("div");

      stockNumber.className =
        "stock-number";

      stockNumber.textContent =
        formatNumber(item.stok);


      stockLeft.appendChild(stockLabel);
      stockLeft.appendChild(stockNumber);


      /*
       * STATUS STOK
       */
      const status =
        document.createElement("div");

      status.className =
        "status";


      const stockValue =
        parseStock(item.stok);


      if (stockValue > 0) {

        status.classList.add(
          "status-available"
        );

        status.textContent =
          "✓ STOK TERSEDIA";

      } else if (stockValue === 0) {

        status.classList.add(
          "status-empty"
        );

        status.textContent =
          "✕ STOK HABIS";

      } else {

        /*
         * Stok minus biasanya berarti
         * sedang proses PO / restock.
         */
        status.classList.add(
          "status-po"
        );

        status.textContent =
          "↻ PROSES PO / RESTOCK";

      }


      stockBox.appendChild(stockLeft);
      stockBox.appendChild(status);


      /*
       * HARGA / DISKON
       */
      const priceArea =
        document.createElement("div");

      priceArea.className =
        "price-area";


      const discountRow =
        createPriceRow(
          "Diskon",
          formatDiscount(item.diskon),
          "discount"
        );


      const nominalRow =
        createPriceRow(
          "Potongan",
          formatRupiah(item.nominalDisc)
        );


      const finalRow =
        createPriceRow(
          "Harga setelah diskon",
          formatRupiah(item.hargaDiskon),
          "final-price"
        );


      priceArea.appendChild(discountRow);
      priceArea.appendChild(nominalRow);
      priceArea.appendChild(finalRow);


      /*
       * KETERANGAN
       */
      let note = null;

      if (item.keterangan) {

        note =
          document.createElement("div");

        note.className = "note";

        note.textContent =
          "Keterangan: " +
          item.keterangan;
      }


      /*
       * Gabungkan
       */
      card.appendChild(name);
      card.appendChild(plu);
      card.appendChild(stockBox);
      card.appendChild(priceArea);

      if (note) {
        card.appendChild(note);
      }


      return card;
    }


    /*
     * Baris harga
     */
    function createPriceRow(
      label,
      value,
      className
    ) {

      const row =
        document.createElement("div");

      row.className =
        "price-row";


      const labelElement =
        document.createElement("div");

      labelElement.className =
        "label";

      labelElement.textContent =
        label;


      const valueElement =
        document.createElement("div");

      if (className) {
        valueElement.className =
          className;
      }

      valueElement.textContent =
        value;


      row.appendChild(labelElement);
      row.appendChild(valueElement);


      return row;
    }


    /*
     * Format angka
     */
    function formatNumber(value) {

      const number =
        parseStock(value);

      return number.toLocaleString("id-ID");
    }


    /*
     * Format Rupiah
     */
    function formatRupiah(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "Rp0";
      }

      const clean =
        String(value)
          .replace(/[^\d-]/g, "");

      const number =
        Number(clean) || 0;

      return "Rp" +
        number.toLocaleString("id-ID");
    }


    /*
     * Format diskon
     */
    function formatDiscount(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "0%";
      }

      return String(value) + "%";
    }


    /*
     * Parse stok
     */
    function parseStock(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return 0;
      }

      const number =
        Number(
          String(value)
            .replace(/,/g, "")
            .trim()
        );

      return isNaN(number)
        ? 0
        : number;
    }


    /*
     * Error
     */
    function showError(message) {

      document.getElementById("loading").style.display =
        "none";

      document.getElementById("info").textContent =
        "";

      document.getElementById("results").innerHTML = `
        <div class="empty">
          ❌<br><br>
          ${message}
        </div>
      `;
    }


    /*
     * Mulai mengambil data
     */
    loadData();

  </script>

</body>
</html>
