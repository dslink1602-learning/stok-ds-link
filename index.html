<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STOK DS LINK</title>

  <!-- Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    /* HEADER */
    .header {
      background: #1565b3;
      color: white;
      text-align: center;
      padding: 22px 15px;
      font-size: 30px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 22px auto;
      padding: 0 15px;
    }

    /* SCAN BUTTON */
    .scan-btn {
      width: 100%;
      background: #1565b3;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,.18);
    }

    .scan-btn:active {
      transform: scale(.99);
    }

    /* SCANNER */
    #scannerBox {
      display: none;
      margin-top: 15px;
      background: white;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    #reader {
      width: 100%;
    }

    .close-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: #555;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .camera-info {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }

    .error-box {
      display: none;
      margin-top: 10px;
      background: #fff0f0;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* SEARCH */
    .search-box {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .search-box:focus {
      border-color: #1565b3;
      box-shadow: 0 0 0 2px rgba(21,101,179,.12);
    }

    .result-count {
      margin: 16px 4px 10px;
      color: #555;
      font-size: 15px;
    }

    /* PRODUCT CARD */
    .product-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .product-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .plu {
      color: #666;
      margin-bottom: 15px;
    }

    .stock-area {
      background: #f4f4f4;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .stock-label {
      color: #666;
      font-size: 15px;
    }

    .stock-number {
      font-size: 26px;
      font-weight: bold;
      margin-top: 3px;
    }

    .status {
      padding: 10px 14px;
      border-radius: 30px;
      font-weight: bold;
      white-space: nowrap;
      font-size: 14px;
    }

    .status-ok {
      background: #e5f7eb;
      color: #087b35;
    }

    .status-habis {
      background: #eeeeee;
      color: #555;
    }

    .status-minus {
      background: #ffe5e5;
      color: #c62828;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 18px 0;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      font-size: 16px;
    }

    .price-label {
      color: #555;
    }

    .price-value {
      font-weight: bold;
    }

    .discount {
      color: #e32620;
      font-weight: bold;
    }

    .final-price {
      color: #df2d26;
      font-size: 27px;
      font-weight: bold;
    }

    .description {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-top: 18px;
      color: #555;
      font-size: 15px;
    }

    .empty {
      background: white;
      border-radius: 12px;
      padding: 35px 20px;
      text-align: center;
      color: #888;
      margin-top: 10px;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .header {
        font-size: 22px;
        padding: 18px 10px;
      }

      .container {
        margin-top: 15px;
      }

      .product-name {
        font-size: 18px;
      }

      .stock-area {
        align-items: flex-start;
      }

      .stock-number {
        font-size: 23px;
      }

      .status {
        font-size: 12px;
        padding: 8px 10px;
      }

      .final-price {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    STOK DS LINK
  </div>

  <div class="container">

    <!-- SCAN -->
    <button class="scan-btn" onclick="startScanner()">
      📷 SCAN BARCODE
    </button>

    <div id="scannerBox">

      <div id="reader"></div>

      <div id="cameraError" class="error-box"></div>

      <button class="close-btn" onclick="stopScanner()">
        Tutup Scanner
      </button>

      <div class="camera-info">
        Arahkan kamera ke barcode produk
      </div>

    </div>

    <!-- SEARCH -->
    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="🔎 Cari PLU / nama produk..."
      autocomplete="off"
    >

    <div id="resultCount" class="result-count"></div>

    <div id="results">
      <div class="empty">
        🔎<br><br>
        Silakan scan barcode<br>
        atau cari PLU / nama produk
      </div>
    </div>

  </div>


<script>

  /* ==========================================
     KONFIGURASI
  ========================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzoE0TDGMvqvVmA3_A4UMsa1xC4Gw6YOXcF94McFV9kommywEzh-oHahOVZuyiYdzBzbA/exec";


  let products = [];
  let scanner = null;
  let scannerRunning = false;


  /* ==========================================
     LOAD DATA
  ========================================== */

  async function loadData() {

    try {

      const response = await fetch(API_URL);

      const result = await response.json();

      if (result.success) {

        products = result.data || [];

        console.log("Data berhasil dimuat:", products.length);

      } else {

        console.error("API gagal:", result);

      }

    } catch (error) {

      console.error("Gagal mengambil data:", error);

      document.getElementById("results").innerHTML = `
        <div class="empty">
          ❌ Gagal mengambil data stok.<br><br>
          Periksa koneksi internet.
        </div>
      `;

    }

  }


  /* ==========================================
     FORMAT RUPIAH
  ========================================== */

  function rupiah(value) {

    const number = Number(
      String(value)
        .replace(/[^0-9-]/g, "")
    );

    if (isNaN(number)) {
      return "Rp0";
    }

    return "Rp" + number.toLocaleString("id-ID");

  }


  /* ==========================================
     STATUS STOK
  ========================================== */

  function getStockStatus(stock) {

    const number = Number(stock);

    if (number > 0) {

      return {
        text: "✓ STOK TERSEDIA",
        className: "status-ok"
      };

    }

    if (number === 0) {

      return {
        text: "STOK HABIS",
        className: "status-habis"
      };

    }

    return {
      text: "STOK MINUS",
      className: "status-minus"
    };

  }


  /* ==========================================
     SEARCH
  ========================================== */

  function searchProducts(keyword) {

    keyword = String(keyword || "")
      .trim()
      .toLowerCase();

    if (!keyword) {

      document.getElementById("resultCount").innerHTML = "";

      document.getElementById("results").innerHTML = `
        <div class="empty">
          🔎<br><br>
          Silakan scan barcode<br>
          atau cari PLU / nama produk
        </div>
      `;

      return;
    }


    const filtered = products.filter(product => {

      const plu = String(product.plu || "").toLowerCase();

      const nama = String(product.nama || "").toLowerCase();

      const keterangan =
        String(product.keterangan || "").toLowerCase();

      return (
        plu.includes(keyword) ||
        nama.includes(keyword) ||
        keterangan.includes(keyword)
      );

    });


    displayProducts(filtered);

  }


  /* ==========================================
     DISPLAY PRODUCT
  ========================================== */

  function displayProducts(data) {

    const resultCount =
      document.getElementById("resultCount");

    const results =
      document.getElementById("results");


    resultCount.innerHTML =
      `Ditemukan <b>${data.length}</b> produk`;


    if (data.length === 0) {

      results.innerHTML = `
        <div class="empty">
          ❌ Produk tidak ditemukan
        </div>
      `;

      return;
    }


    results.innerHTML = data.map(product => {

      const stock =
        Number(product.stok || 0);

      const status =
        getStockStatus(stock);


      const discount =
        Number(product.diskon || 0);


      const nominalDisc =
        Number(
          String(product.nominalDisc || "0")
            .replace(/[^0-9-]/g, "")
        );


      const hargaDiskon =
        Number(
          String(product.hargaDiskon || "0")
            .replace(/[^0-9-]/g, "")
        );


      return `

        <div class="product-card">

          <div class="product-name">
            ${escapeHtml(product.nama || "-")}
          </div>

          <div class="plu">
            PLU: ${escapeHtml(product.plu || "-")}
          </div>


          <div class="stock-area">

            <div>

              <div class="stock-label">
                STOK AKHIR
              </div>

              <div class="stock-number">
                ${stock}
              </div>

            </div>


            <div class="status ${status.className}">
              ${status.text}
            </div>

          </div>


          <div class="divider"></div>


          <div class="price-row">

            <span class="price-label">
              Diskon
            </span>

            <span class="price-value discount">
              ${discount}%
            </span>

          </div>


          <div class="price-row">

            <span class="price-label">
              Potongan
            </span>

            <span class="price-value">
              ${rupiah(nominalDisc)}
            </span>

          </div>


          <div class="price-row">

            <span class="price-label">
              Harga setelah diskon
            </span>

            <span class="final-price">
              ${rupiah(hargaDiskon)}
            </span>

          </div>


          ${
            product.keterangan
            ?
            `
              <div class="description">
                Keterangan:
                ${escapeHtml(product.keterangan)}
              </div>
            `
            :
            ""
          }

        </div>

      `;

    }).join("");

  }


  /* ==========================================
     SCANNER
  ========================================== */

  async function startScanner() {

    const scannerBox =
      document.getElementById("scannerBox");

    const errorBox =
      document.getElementById("cameraError");


    scannerBox.style.display = "block";

    errorBox.style.display = "none";

    errorBox.innerHTML = "";


    if (scannerRunning) {
      return;
    }


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(width, height) {

        const size =
          Math.min(width, height) * 0.7;

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    try {

      await scanner.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      );


      scannerRunning = true;


    } catch (error) {

      console.error("Camera error:", error);

      errorBox.style.display = "block";

      errorBox.innerHTML = `
        <b>❌ Kamera tidak dapat digunakan</b><br><br>

        Browser menolak akses kamera.<br><br>

        Pastikan izin kamera untuk Chrome
        sudah diperbolehkan.
      `;

    }

  }


  /* ==========================================
     SCAN SUCCESS
  ========================================== */

  async function onScanSuccess(decodedText) {

    console.log("Barcode terbaca:", decodedText);


    // Hentikan scanner
    await stopScanner();


    // Masukkan hasil scan ke search box
    const searchInput =
      document.getElementById("searchInput");

    searchInput.value = decodedText;


    // Cari produk
    searchProducts(decodedText);


    // Scroll ke hasil
    setTimeout(() => {

      document.getElementById("results")
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

    }, 100);

  }


  function onScanFailure(error) {

    // Sengaja dikosongkan.
    // Scanner akan terus mencoba membaca barcode.

  }


  /* ==========================================
     STOP SCANNER
  ========================================== */

  async function stopScanner() {

    if (scanner && scannerRunning) {

      try {

        await scanner.stop();

        scanner.clear();

      } catch (error) {

        console.log(error);

      }

    }


    scannerRunning = false;

    scanner = null;


    document.getElementById("scannerBox")
      .style.display = "none";

  }


  /* ==========================================
     ESCAPE HTML
  ========================================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================
     SEARCH EVENT
  ========================================== */

  document
    .getElementById("searchInput")
    .addEventListener("input", function() {

      searchProducts(this.value);

    });


  /* ==========================================
     INITIAL LOAD
  ========================================== */

  loadData();

</script>

</body>
</html>
